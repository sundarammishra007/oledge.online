<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle for contrast -->
  <circle cx="256" cy="256" r="240" fill="#f8fafc" />

  <g filter="url(#softShadow)">
    <!-- Large Blue 'G' -->
    <text x="256" y="240" font-family="Arial, sans-serif" font-size="220" font-weight="900" fill="url(#blueGrad)" text-anchor="middle">G</text>
    
    <!-- Blue 'o' under the 'G' -->
    <circle cx="256" cy="360" r="80" fill="url(#blueGrad)" />
    
    <!-- 'Og' in white inside the 'o' -->
    <text x="256" y="375" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="white" text-anchor="middle">Og</text>
  </g>
</svg>
